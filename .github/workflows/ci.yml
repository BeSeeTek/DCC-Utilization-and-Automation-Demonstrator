name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  certificate-path-validation:
    name: Certificate path-validation tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The full requirements.txt targets the Windows GUI app (pywin32, pywinauto,
      # xmlsec, matplotlib, ...) and does not install on Linux. The path-validation
      # tests stub every GUI/network dependency, so only these runtime libraries
      # are actually needed to exercise the trust-anchor and chain-validation code.
      - name: Install the runtime dependencies the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography lxml pytz

      - name: Run certificate path-validation tests
        run: python tests/test_certificate_path_validation.py

  xml-signature-integrity:
    name: XMLDSig seal integrity tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # This suite verifies REAL XML digital signatures with xmlsec against the
      # sealed sample DCCs, so xmlsec must not be stubbed. The PyPI xmlsec wheels
      # bundle libxmlsec1, so no system packages are required.
      - name: Install the runtime dependencies the tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install xmlsec lxml cryptography pytz

      - name: Run XMLDSig seal integrity tests
        run: python tests/test_xml_signature_integrity.py
